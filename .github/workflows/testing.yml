name: Tests

on:
  push:
    branches:
      - v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  test:
    name: Test and lint (Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.26'
          - '1.25'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Run Unit tests
        run: make test
